<script>
/* ── Pratt Digital PIN gate ── */
(function() {
  var SESSION_KEY = 'geo_pd_eleven-australia_auth';

  async function sha256(str) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }

  var correctHash = null;
  sha256('6933').then(function(h) { correctHash = h; });

  if (sessionStorage.getItem(SESSION_KEY) === '1') return;

  var overlay = document.createElement('div');
  overlay.id = 'pd-pin-overlay';
  overlay.style.cssText = [
    'position:fixed','inset:0','z-index:99999',
    'background:rgba(15,23,42,0.97)',
    'display:flex','align-items:center','justify-content:center',
    'font-family:system-ui,sans-serif'
  ].join(';');

  overlay.innerHTML = [
    '<div style="background:#1e293b;border-radius:16px;padding:40px 36px;',
    'max-width:340px;width:90%;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.5)">',
    '<div style="font-size:28px;margin-bottom:8px">🔒</div>',
    '<h2 style="color:#f1f5f9;margin:0 0 6px;font-size:18px">Geo Intelligence Suite</h2>',
    '<p style="color:#94a3b8;font-size:13px;margin:0 0 24px">Enter your access PIN to continue</p>',
    '<input id="pd-pin-input" type="password" inputmode="numeric" maxlength="10" ',
    'placeholder="PIN" style="width:100%;box-sizing:border-box;padding:12px 16px;',
    'font-size:20px;letter-spacing:6px;text-align:center;border:1.5px solid #334155;',
    'border-radius:8px;background:#0f172a;color:#f1f5f9;outline:none;margin-bottom:12px">',
    '<button id="pd-pin-btn" style="width:100%;padding:12px;background:#3b82f6;',
    'color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;',
    'cursor:pointer">Unlock</button>',
    '<p id="pd-pin-err" style="color:#f87171;font-size:12px;margin:10px 0 0;',
    'display:none">Incorrect PIN — please try again</p>',
    '</div>'
  ].join('');

  document.documentElement.appendChild(overlay);

  async function attempt() {
    var val = document.getElementById('pd-pin-input').value.trim();
    if (!val) return;
    var h = await sha256(val);
    if (h === correctHash) {
      sessionStorage.setItem(SESSION_KEY, '1');
      document.getElementById('pd-pin-overlay').remove();
    } else {
      document.getElementById('pd-pin-err').style.display = '';
      document.getElementById('pd-pin-input').value = '';
      document.getElementById('pd-pin-input').focus();
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    var btn = document.getElementById('pd-pin-btn');
    var inp = document.getElementById('pd-pin-input');
    if (btn) btn.addEventListener('click', attempt);
    if (inp) inp.addEventListener('keydown', function(e){ if(e.key==='Enter') attempt(); });
    if (inp) inp.focus();
  });
})();
</script>

<style>

<script>
/* ── Pratt Digital multi-dataset storage: customers ── */
(function() {
  var DS_KEY  = 'geo_pd_eleven-australia_customers_datasets';
  var ACT_KEY = 'geo_pd_eleven-australia_customers_active';

  function _all()   { try { return JSON.parse(localStorage.getItem(DS_KEY)||'{}'); } catch(e) { return {}; } }
  function _save(o) { try { localStorage.setItem(DS_KEY, JSON.stringify(o)); } catch(e) {} }

  window.pdSave_customers = function(data, name) {
    var all = _all();
    name = name || 'Dataset ' + (Object.keys(all).length + 1);
    // Persist the CSV column metadata alongside the rows, so a restored dataset
    // keeps the client's own column labels (e.g. "Eleven Retail Net Sales").
    var meta = null;
    try {
      if (typeof window.pdCaptureMeta === 'function') meta = window.pdCaptureMeta('customers');
    } catch(e) {}
    all[name] = { data: data, count: data.length, savedAt: new Date().toISOString(), meta: meta };
    _save(all);
    localStorage.setItem(ACT_KEY, name);
  };
  window.pdLoad_customers = function() {
    var all = _all(), keys = Object.keys(all);
    if (!keys.length) return null;
    var name = localStorage.getItem(ACT_KEY);
    if (!name || !all[name]) name = keys[0];
    return Object.assign({ name: name }, all[name]);
  };
  window.pdAllDatasets_customers = function() { return _all(); };
  window.pdSetActive_customers   = function(name) { localStorage.setItem(ACT_KEY, name); };
  window.pdDeleteDataset_customers = function(name) {
    var all = _all(); delete all[name]; _save(all);
    var keys = Object.keys(all);
    localStorage.setItem(ACT_KEY, keys.length ? keys[0] : '');
  };
  window.pdClear_customers = function() {
    localStorage.removeItem(DS_KEY);
    localStorage.removeItem(ACT_KEY);
  };
  window.pdRawGet_customers = function(name) {
    var all = _all();
    return all[name] || null;
  };
})();
</script>

<script>
const RAW = typeof DWELLING_DATA !== 'undefined' ? DWELLING_DATA : {};
// Compute garden score: detached×1.0 + semi×0.5 + terraced×0.1 (flats contribute 0)
// Hierarchy: detached > semi > terraced > flat
function validCoords(lat, lng) {
  if (!lat || !lng) return false;
  if (lat < 49.9 || lat > 60.9) return false;
  if (lng < -7.6 || lng > 2.0) return false;
  if (lat < 51.5 && lng < -5.8) return false; // Atlantic patch west of Cornwall
  return true;
}
const DATA = Object.fromEntries(Object.entries(RAW)
  .filter(([,d]) => validCoords(d.lat, d.lng))
  .map(([k,d]) => [k, {
    ...d,
    garden: Math.min(10, Math.max(1, Math.round((d.detached * 1.0 + d.semi * 0.5 + d.terraced * 0.1) / 6)))
  }]));

const MODE_COLOURS = {
  detached: '#2d5be3',
  semi:     '#06b6d4',
  terraced: '#f59e0b',
  flat:     '#e24b4a',
  garden:   '#18a058'
};
const MODE_LABELS = {
  detached: 'Detached %',
  semi:     'Semi-detached %',
  terraced: 'Terraced %',
  flat:     'Flats %',
  garden:   'Garden Score (1–10)'
};

let currentMode = 'detached';
let markerLayer = null;
let markerMap = {};
let currentOpacities = {};

// Customer state
let customerData = [];
let customerResults = [];
let customerLayer = null;

const map = L.map('map', { zoomControl: true }).setView([52.8, -1.5], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 18
}).addTo(map);

function getMax(mode) {
  return Math.max(...Object.values(DATA).map(d => d[mode]));
}

function buildLayer(mode) {
  if (markerLayer) { markerLayer.clearLayers(); }
  markerLayer = L.layerGroup().addTo(map);
  markerMap = {};
  const maxVal = getMax(mode);
  const colour = MODE_COLOURS[mode];
  Object.entries(DATA).forEach(([district, d]) => {
    const val = d[mode];
    const intensity = maxVal > 0 ? val / maxVal : 0;
    const opacity = 0.15 + intensity * 0.75;
    const marker = L.circleMarker([d.lat, d.lng], {
      radius: 9,
      color: colour,
      weight: 1,
      fillColor: colour,
      fillOpacity: opacity,
      opacity: 0.7
    });
    marker.on('click', function() {
      showStats(district, d);
      showPopup(marker, district, d);
    });
    marker.bindTooltip(district, { permanent: false, direction: 'top', className: '' });
    markerLayer.addLayer(marker);
    currentOpacities[district.toUpperCase()] = opacity;
    markerMap[district.toUpperCase()] = { marker, d };
  });
  updateLegend(mode, maxVal);
  applyFilters();
  showExportBtns(true);
}

function updateLegend(mode, maxVal) {
  const colour = MODE_COLOURS[mode];
  const bar = document.getElementById('legend-bar');
  bar.style.background = 'linear-gradient(to right, ' + colour + '26, ' + colour + ')';
  const isGarden = mode === 'garden';
  document.getElementById('legend-lo').textContent = isGarden ? '1' : '0%';
  document.getElementById('legend-mid').textContent = isGarden ? '5' : Math.round(maxVal / 2) + '%';
  document.getElementById('legend-hi').textContent = isGarden ? '10' : maxVal + '%';
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  buildLayer(mode);
}

function showPopup(marker, district, d) {
  const html = '<div style="font-family:\'DM Sans\',sans-serif;font-size:12px;min-width:150px;">'
    + '<div style="font-family:\'DM Mono\',monospace;font-weight:700;font-size:14px;margin-bottom:6px;color:#2d5be3;">' + district + '</div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:3px;"><span style="color:#6b6960;">Detached</span><strong>' + d.detached + '%</strong></div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:3px;"><span style="color:#6b6960;">Semi</span><strong>' + d.semi + '%</strong></div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:3px;"><span style="color:#6b6960;">Terraced</span><strong>' + d.terraced + '%</strong></div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="color:#6b6960;">Flat</span><strong>' + d.flat + '%</strong></div>'
    + '<div style="background:#e8f7f0;border:1px solid #18a058;border-radius:12px;padding:3px 8px;display:inline-block;color:#18a058;font-weight:600;font-size:11px;">Garden score: ' + d.garden + '/10</div>'
    + '</div>';
  marker.bindPopup(html).openPopup();
}

function showStats(district, d) {
  const panel = document.getElementById('stats-panel');
  const rows = [
    { key: 'detached', label: 'Detached',      colour: '#2d5be3', val: d.detached, suffix: '%' },
    { key: 'semi',     label: 'Semi-detached', colour: '#06b6d4', val: d.semi,     suffix: '%' },
    { key: 'terraced', label: 'Terraced',      colour: '#f59e0b', val: d.terraced, suffix: '%' },
    { key: 'flat',     label: 'Flats',         colour: '#e24b4a', val: d.flat,     suffix: '%' },
  ];
  const rowsHtml = rows.map(r =>
    '<div class="stats-row">'
    + '<span class="dot" style="background:' + r.colour + '"></span>'
    + '<span class="lbl">' + r.label + '</span>'
    + '<div class="stats-bar-bg"><div class="stats-bar-fill" style="width:' + r.val + '%;background:' + r.colour + '"></div></div>'
    + '<span class="val">' + r.val + r.suffix + '</span>'
    + '</div>').join('');
  panel.innerHTML = '<div class="stats-district">' + district + '</div>'
    + rowsHtml
    + '<div class="garden-badge">&#127807; Garden score: ' + d.garden + ' / 10</div>';
}

function doSearch() {
  const raw = document.getElementById('search-input').value.trim().toUpperCase();
  const msg = document.getElementById('search-msg');
  if (!raw) { msg.textContent = 'Enter a postcode district.'; return; }
  const entry = markerMap[raw];
  if (!entry) { msg.textContent = '"' + raw + '" not found. Try: CM13, TN1, SW4, M20, EH3, G12'; msg.style.color = '#e24b4a'; return; }
  msg.textContent = '';
  msg.style.color = '';
  map.flyTo([entry.d.lat, entry.d.lng], 11, { duration: 1 });
  showStats(raw, entry.d);
  setTimeout(() => showPopup(entry.marker, raw, entry.d), 900);
}

document.getElementById('search-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});

function getFilteredDistricts() {
  const minGarden = parseInt(document.getElementById('filter-garden').value);
  const minDet    = parseInt(document.getElementById('filter-detached').value);
  const minSemi   = parseInt(document.getElementById('filter-semi').value);
  const maxFlat   = parseInt(document.getElementById('filter-flat').value);
  return Object.entries(DATA).filter(([, d]) =>
    d.garden >= minGarden && d.detached >= minDet && d.semi >= minSemi && d.flat <= maxFlat
  );
}

function applyFilters() {
  const minGarden = parseInt(document.getElementById('filter-garden').value);
  const minDet    = parseInt(document.getElementById('filter-detached').value);
  const minSemi   = parseInt(document.getElementById('filter-semi').value);
  const maxFlat   = parseInt(document.getElementById('filter-flat').value);

  document.getElementById('lbl-garden').textContent   = minGarden;
  document.getElementById('lbl-detached').textContent = minDet;
  document.getElementById('lbl-semi').textContent     = minSemi;
  document.getElementById('lbl-flat').textContent     = maxFlat;

  let shown = 0;
  Object.entries(markerMap).forEach(([district, { marker, d }]) => {
    const pass = d.garden >= minGarden && d.detached >= minDet && d.semi >= minSemi && d.flat <= maxFlat;
    if (pass) { marker.setStyle({ opacity: 0.7, fillOpacity: currentOpacities[district] }); shown++; }
    else       { marker.setStyle({ opacity: 0, fillOpacity: 0 }); }
  });
  document.getElementById('filter-count').textContent = shown + ' districts shown';
}

function resetFilters() {
  document.getElementById('filter-garden').value   = 1;
  document.getElementById('filter-detached').value = 0;
  document.getElementById('filter-semi').value     = 0;
  document.getElementById('filter-flat').value     = 100;
  applyFilters();
}

// ── Customer upload helpers ───────────────────────────────────────────────
function normalisePC(s) {
  if (!s) return null;
  const c = s.replace(/\s+/g,'').toUpperCase();
  if (c.length >= 5 && c.length <= 7) return c.slice(0,-3) + ' ' + c.slice(-3);
  return null;
}
function extractPC(s) {
  const m = s.match(/([A-Z]{1,2}\d{1,2}[A-Z]?\s*\d[A-Z]{2})/i);
  return m ? normalisePC(m[1]) : null;
}
function parseCustomers(text) {
  // This tool works on bare postcodes; PDCSV is used for its quote-safe parsing
  // and postcode-column detection. Extra columns are not carried through here.
  customerData = PDCSV.records(text).records.map(r => r.postcode);
  const statusEl = document.getElementById('customer-status');
  statusEl.textContent = customerData.length ? customerData.length + ' postcodes ready' : '';
  const btn = document.getElementById('analyseBtn');
  btn.style.display = customerData.length ? 'block' : 'none';
}

// ── File input events ─────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  const fileInput = document.getElementById('fileInput');
  const uploadLabel = document.getElementById('uploadLabel');
  const pasteArea = document.getElementById('pasteArea');

  fileInput.addEventListener('change', function() {
    const f = this.files[0]; if (!f) return;
    document.getElementById('fileName').textContent = f.name;
    uploadLabel.style.borderStyle = 'solid';
    const r = new FileReader();
    r.onload = function(e) { parseCustomers(e.target.result); pasteArea.value = ''; };
    r.readAsText(f);
  });

  pasteArea.addEventListener('input', function() { parseCustomers(this.value); });

  uploadLabel.addEventListener('dragover', function(e) {
    e.preventDefault(); this.classList.add('dragover');
  });
  uploadLabel.addEventListener('dragleave', function() {
    this.classList.remove('dragover');
  });
  uploadLabel.addEventListener('drop', function(e) {
    e.preventDefault(); this.classList.remove('dragover');
    const f = e.dataTransfer.files[0]; if (!f) return;
    document.getElementById('fileName').textContent = f.name;
    this.style.borderStyle = 'solid';
    const r = new FileReader();
    r.onload = function(ev) { parseCustomers(ev.target.result); pasteArea.value = ''; };
    r.readAsText(f);
  });
});

// ── geocodeDistricts ──────────────────────────────────────────────────────
// Geocodes unique outward codes (e.g. "YO26") via postcodes.io /outcodes.
// Far fewer calls than per-postcode lookup; markers plot at district centre.
async function geocodeDistricts(districts) {
  const TIMEOUT_MS = 8000, res = {};
  const statusEl = document.getElementById('customer-status');
  let done = 0;

  async function fetchOne(district) {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const r = await fetch('https://api.postcodes.io/outcodes/' + encodeURIComponent(district), {
        signal: ctrl.signal
      });
      clearTimeout(tid);
      if (r.ok) {
        const d = await r.json();
        if (d.status === 200 && d.result) {
          res[district] = { lat: d.result.latitude, lng: d.result.longitude, valid: true };
        } else {
          res[district] = { valid: false };
        }
      } else {
        res[district] = { valid: false };
      }
    } catch(e) {
      clearTimeout(tid);
      res[district] = { valid: false };
    }
    done++;
    statusEl.textContent = 'Geocoding… ' + done + '/' + districts.length + ' districts';
  }

  // Run up to 6 requests concurrently
  const CONCURRENCY = 6;
  for (let i = 0; i < districts.length; i += CONCURRENCY) {
    await Promise.all(districts.slice(i, i + CONCURRENCY).map(fetchOne));
  }
  return res;
}

// ── Run customer analysis ─────────────────────────────────────────────────
async function runCustomerAnalysis() {
  if (!customerData.length) return;
  const btn = document.getElementById('analyseBtn');
  btn.disabled = true;
  btn.textContent = 'Geocoding…';

  // Extract unique districts and geocode those instead of individual postcodes
  const districtOf = pc => pc.replace(/\s.*/, '').toUpperCase();
  const uniqueDistricts = [...new Set(customerData.map(districtOf))];
  const geo = await geocodeDistricts(uniqueDistricts);

  customerResults = [];
  for (const pc of customerData) {
    const district = districtOf(pc);
    const g = geo[district];
    if (!g || !g.valid) continue;
    const dwellingDistrict = DATA[district] || null;
    customerResults.push({
      postcode: pc,
      district: district,
      lat: g.lat,
      lng: g.lng,
      detached: dwellingDistrict ? dwellingDistrict.detached : null,
      semi: dwellingDistrict ? dwellingDistrict.semi : null,
      terraced: dwellingDistrict ? dwellingDistrict.terraced : null,
      flat: dwellingDistrict ? dwellingDistrict.flat : null,
      garden: dwellingDistrict ? dwellingDistrict.garden : null
    });
  }

  // Plot customer layer
  if (customerLayer) { map.removeLayer(customerLayer); }
  customerLayer = L.layerGroup().addTo(map);
  for (const c of customerResults) {
    const m = L.circleMarker([c.lat, c.lng], {
      radius: 5,
      color: '#7e22ce',
      weight: 2,
      fillOpacity: 0,
      opacity: 0.85
    });
    m.bindTooltip(c.postcode, { permanent: false, direction: 'top' });
    customerLayer.addLayer(m);
  }

  const statusEl = document.getElementById('customer-status');
  statusEl.textContent = customerResults.length + ' customers plotted';
  btn.disabled = false;
  updateCustomerStats();
  btn.textContent = 'Re-analyse';
}

// ── darken / lighten ──────────────────────────────────────────────────────
function darken(hex, pct) {
  const n = parseInt(hex.slice(1), 16), f = 1 - pct / 100;
  return '#' + [((n>>16)&0xff),((n>>8)&0xff),(n&0xff)].map(v => Math.max(0,Math.round(v*f)).toString(16).padStart(2,'0')).join('');
}
function lighten(hex, pct) {
  const n = parseInt(hex.slice(1), 16), f = pct / 100;
  return '#' + [((n>>16)&0xff),((n>>8)&0xff),(n&0xff)].map(v => Math.min(255,Math.round(v+(255-v)*f)).toString(16).padStart(2,'0')).join('');
}

// ── XLSX Export ───────────────────────────────────────────────────────────
function exportXLSX() {
  if (typeof XLSX === 'undefined') { alert('XLSX library not loaded.'); return; }
  const wb = XLSX.utils.book_new();
  const filtered = getFilteredDistricts();

  // Sheet 1: Filtered Districts
  const distRows = [['District','Detached%','Semi%','Terraced%','Flat%','Garden Score','Lat','Lng']];
  filtered.forEach(([district, d]) => {
    distRows.push([district, d.detached, d.semi, d.terraced, d.flat, d.garden, d.lat, d.lng]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(distRows), 'Filtered Districts');

  // Sheet 2: Sectors
  const sectorRows = [['Sector','District','Detached%','Semi%','Terraced%','Flat%','Garden Score']];
  filtered.forEach(([district, d]) => {
    for (let i = 0; i <= 9; i++) {
      const sector = district + ' ' + i;
      if (typeof VALID_SECTORS !== 'undefined' && VALID_SECTORS.has(sector)) {
        sectorRows.push([sector, district, d.detached, d.semi, d.terraced, d.flat, d.garden]);
      } else if (typeof VALID_SECTORS === 'undefined') {
        sectorRows.push([sector, district, d.detached, d.semi, d.terraced, d.flat, d.garden]);
      }
    }
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sectorRows), 'Sectors');

  // Sheet 3: Customer Analysis (only if customers present)
  if (customerResults.length > 0) {
    const custRows = [['Postcode','District','Detached%','Semi%','Terraced%','Flat%','Garden Score']];
    customerResults.forEach(c => {
      custRows.push([c.postcode, c.district, c.detached, c.semi, c.terraced, c.flat, c.garden]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(custRows), 'Customer Analysis');
  }

  XLSX.writeFile(wb, 'dwelling_analysis_' + new Date().toISOString().slice(0,10) + '.xlsx');
}

  }

    try { branding = JSON.parse(localStorage.getItem('geoSuiteSettings') || '{}'); } catch(e) {}
  }
  const agencyName = branding.name || 'Pratt Digital';
  const primary    = branding.primary || '#2d5be3';
  const logoSrc    = branding.logoUrl || branding.logo || '';
  const primaryDark  = darken(primary, 15);

    + '.print-btn.primary{background:var(--primary);color:#fff;}'
    + '.print-btn.secondary{background:#fff;color:var(--slate);border:1px solid var(--border);}'
    + '</style></head><body>'
    + '<div class="page">'
    + '<div class="brief-header">'
    + (logoSrc ? '<img class="header-logo" src="' + logoSrc + '" alt="' + agencyName + '">' : '<div class="header-logo placeholder">' + agencyName + '</div>')
    + '<div class="header-right"><div class="brief-title">Dwelling Intelligence Report</div><div class="brief-meta">Generated ' + today + ' · ' + agencyName + ' · Geo Intelligence Suite</div></div>'
    + '</div>'
    + '<div class="section-title">Filter Summary</div>'
    + '<div class="filter-summary">' + filterSummary + '</div>'
    + '<div class="section-title">Top Districts by Garden Score</div>'
    + '<table class="loc-table">'
    + '<thead><tr><th>District</th><th>Detached%</th><th>Semi%</th><th>Terraced%</th><th>Flat%</th><th>Garden Score</th></tr></thead>'
    + '<tbody>'
    + top20.map(function(entry) {
        var d2 = entry[0]; var dv = entry[1];
        var bs = gardenBadgeStyle(dv.garden);
        return '<tr>'
          + '<td style="font-family:monospace;font-weight:600">' + d2 + '</td>'
          + '<td>' + dv.detached + '%</td>'
          + '<td>' + dv.semi + '%</td>'
          + '<td>' + dv.terraced + '%</td>'
          + '<td>' + dv.flat + '%</td>'
          + '<td><span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;' + bs + '">' + dv.garden + '</span></td>'
          + '</tr>';
      }).join('')
    + '</tbody></table>'
    + '<div class="section-title" style="margin-top:20px">Dwelling Type Breakdown</div>'
    + '<div class="stat-grid">'
    + '<div class="stat-card"><h4>Avg Detached</h4><div class="val">' + avgDet + '%</div><div class="sub">across ' + filtered.length + ' districts</div></div>'
    + '<div class="stat-card a"><h4>Avg Semi</h4><div class="val">' + avgSemi + '%</div><div class="sub">across ' + filtered.length + ' districts</div></div>'
    + '<div class="stat-card"><h4>Avg Terraced</h4><div class="val">' + avgTerr + '%</div><div class="sub">across ' + filtered.length + ' districts</div></div>'
    + '<div class="stat-card r"><h4>Avg Flat</h4><div class="val">' + avgFlat + '%</div><div class="sub">across ' + filtered.length + ' districts</div></div>'
    + '</div>'
    + customerSectionHTML
    + '<div class="brief-footer">'
    + '<span>' + agencyName + ' · Geo Intelligence Suite · Dwelling Explorer</span>'
    + '<span>' + today + ' · Confidential</span>'
    + '</div>'
    + '</div>'
    + '<div class="print-bar no-print">'
    + '<button class="print-btn secondary" onclick="window.close()">&#10005; Close</button>'
    + '<button class="print-btn primary" onclick="window.print()">&#128438; Save as PDF</button>'
    + '</div>'
    + '</body></html>';

  const w = window.open('', '_blank');
  w.document.write(briefHTML);
  w.document.close();
}

function updateCustomerStats() {
  const known = customerResults.filter(c => c.garden !== null);
  if (!known.length) return;
  const avg = key => Math.round(known.reduce((s,c) => s + c[key], 0) / known.length);
  const avgGarden = (known.reduce((s,c) => s + c.garden, 0) / known.length).toFixed(1);
  document.getElementById('cust-det').textContent   = avg('detached') + '%';
  document.getElementById('cust-semi').textContent  = avg('semi') + '%';
  document.getElementById('cust-terr').textContent  = avg('terraced') + '%';
  document.getElementById('cust-flat').textContent  = avg('flat') + '%';
  document.getElementById('cust-garden').textContent = avgGarden + ' / 10';
  document.getElementById('cust-count').textContent  = known.length + ' customers with dwelling data';
  document.getElementById('customer-stats-wrap').style.display = '';
}

buildLayer(currentMode);
</script>

<script>

/* ─── PD dataset picker: customers ─── */
(function() {

  function fmtDate(s) {
    try { return new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
    catch(e) { return ''; }
  }

  function renderPicker(ns_active) {
    var all = pdAllDatasets_customers();
    var names = Object.keys(all);
    // Find the element to replace: either the original label or the existing picker div
    var lbl = document.getElementById('uploadLabel') || document.getElementById('pd-picker-customers');
    if (!lbl) return;

    var sel = '<select id="pd-sel-customers" style="width:100%;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;margin-bottom:6px;background:#fff">';
    names.forEach(function(n) {
      sel += '<option value="' + n.replace(/"/g,'&quot;') + '"' + (n === ns_active ? ' selected' : '') + '>'
           + n + ' (' + all[n].count + ')</option>';
    });
    sel += '</select>';

    lbl.outerHTML =
      '<div id="pd-picker-customers" style="border:1.5px solid #16a34a;border-radius:8px;padding:10px 12px;font-size:12px;">'
      + '<div style="font-weight:600;color:#16a34a;margin-bottom:6px">Saved datasets</div>'
      + sel
      + '<div style="display:flex;gap:6px;margin-bottom:8px">'
      + '<button onclick="pdUseSelected_customers()" style="flex:1;padding:5px 0;background:#16a34a;color:#fff;border:none;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer">Load selected</button>'
      + '<button onclick="pdDeleteSelected_customers()" style="padding:5px 10px;background:#f3f4f6;color:#6b7280;border:1px solid #d1d5db;border-radius:5px;font-size:11px;cursor:pointer">Delete</button>'
      + '</div>'
      + '<div style="border-top:1px solid #e5e7eb;padding-top:8px;color:#6b7280;font-size:11px">'
      + '<label style="cursor:pointer;display:inline-flex;align-items:center;gap:4px">'
      + '<input type="file" id="pd-fi-customers" accept=".csv,.txt,.xlsx" style="display:none">'
      + '&#43; Upload new dataset</label>'
      + '</div>'
      + '</div>';

    document.getElementById('pd-fi-customers').addEventListener('change', function() {
      var f = this.files[0]; if (!f) return;
      var name = f.name.replace(/[.][^.]+$/, '') || 'Dataset';
      var r = new FileReader();
      r.onload = function(e) { pdTriggerParse_customers(e.target.result, name); };
      r.readAsText(f);
    });

    if (ns_active && all[ns_active]) {
      updateActiveBadge_customers(ns_active, all[ns_active]);
    }
  }

  // Expose globally at IIFE scope so it's always set, even before first call
  window.pdRenderPicker_customers = renderPicker;

  function updateActiveBadge_customers(name, info) {
    var existing = document.getElementById('pd-active-customers');
    var html = '<div id="pd-active-customers" style="margin-top:6px;padding:6px 10px;background:rgba(0,0,0,0.04);border-radius:6px;font-size:11px;color:#374151">'
      + '&#10003; <strong>' + name + '</strong> &mdash; ' + info.count + ' records'
      + (info.savedAt ? ' &middot; saved ' + fmtDate(info.savedAt) : '')
      + '</div>';
    if (existing) { existing.outerHTML = html; }
    else {
      var picker = document.getElementById('pd-picker-customers');
      if (picker) picker.insertAdjacentHTML('afterend', html);
    }
  }

  window.pdUseSelected_customers = function() {
    var sel = document.getElementById('pd-sel-customers');
    if (!sel) return;
    var name = sel.value;
    var all = pdAllDatasets_customers();
    if (!all[name]) return;
    pdSetActive_customers(name);
    var data = all[name].data;
    if (typeof customerData !== 'undefined') customerData = data;
    var btn=document.getElementById("analyseBtn");if(btn)btn.style.display="";
    updateActiveBadge_customers(name, all[name]);
  };

  window.pdDeleteSelected_customers = function() {
    var sel = document.getElementById('pd-sel-customers');
    if (!sel) return;
    var name = sel.value;
    if (!confirm('Delete dataset "' + name + '"?')) return;
    pdDeleteDataset_customers(name);
    var all = pdAllDatasets_customers();
    if (Object.keys(all).length) {
      renderPicker(pdLoad_customers() ? pdLoad_customers().name : '');
      pdUseSelected_customers();
    } else {
      location.reload();
    }
  };

  window.pdTriggerParse_customers = function(text, name) {
    if (typeof _pdOrigParse_customers === 'function') {
      _pdOrigParse_customers(text);
      setTimeout(function() {
        var data = (typeof customerData !== 'undefined') ? customerData : [];
        if (data.length) {
          pdSave_customers(data, name);
          renderPicker(name);
          updateActiveBadge_customers(name, pdAllDatasets_customers()[name]);
          
        }
      }, 150);
    }
  };

  window._pdOrigParse_customers = null;

  document.addEventListener('DOMContentLoaded', function() {
    var all = pdAllDatasets_customers();
    var names = Object.keys(all);
    var active = pdLoad_customers();

    if (names.length) {
      renderPicker(active ? active.name : names[0]);
      if (active && active.data && active.data.length) {
        if (typeof customerData !== 'undefined') customerData = active.data;
        var name = active.name; // make `name` available to on_load_extra (same scope as pdUseSelected)
        var btn=document.getElementById("analyseBtn");if(btn)btn.style.display="";
      }
    }
  });

})();

document.addEventListener('DOMContentLoaded', function() {
  if (typeof parseCustomers === 'function') {
    _pdOrigParse_customers = parseCustomers;
    parseCustomers = function(text) {
      _pdOrigParse_customers(text);
      // If picker isn't shown yet (first upload), save and render
      if (!document.getElementById('pd-picker-customers')) {
        setTimeout(function() {
          var data = (typeof customerData !== 'undefined') ? customerData : [];
          if (!data.length) return;
          var fi = document.getElementById('fileInput');
          var name = (fi && fi.files && fi.files[0])
            ? fi.files[0].name.replace(/[.][^.]+$/, '') : 'Customers';
          pdSave_customers(data, name);
          if (typeof pdRenderPicker_customers === 'function') pdRenderPicker_customers(name);
          
        }, 150);
      }
    };
  }
});
</script>
</body>
</html>
